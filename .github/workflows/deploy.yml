# CI + deployment pipeline.
#
#   Pull request  → build + link check → preview deploy (URL posted on the PR)
#   Push to main  → build + link check → production deploy → smoke test
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN       — https://vercel.com/account/tokens
#   VERCEL_ORG_ID      — "orgId" in .vercel/project.json (after `vercel link`)
#   VERCEL_PROJECT_ID  — "projectId" in .vercel/project.json
#
# EmailJS keys are pulled from the Vercel project's env vars by `vercel pull`,
# so they only need to live in Vercel, not in GitHub.
name: CI & Deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_CLI: vercel@65.4.0
  SITE_URL: https://www.macrocoats.in

jobs:
  check:
    name: Build & link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check-links

  preview:
    name: Preview deploy
    needs: check
    # Fork PRs don't get secrets, so only deploy previews for branches in this repo.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install -g ${{ env.VERCEL_CLI }}
      - run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
      - id: deploy
        run: echo "url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})" >> "$GITHUB_OUTPUT"
      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const marker = '<!-- vercel-preview -->'
            const body = `${marker}\n**Preview deployed:** ${process.env.PREVIEW_URL}\n\nCommit: ${context.sha.slice(0, 7)}`
            const { owner, repo } = context.repo
            const issue_number = context.issue.number
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number })
            const existing = comments.find((c) => c.body?.includes(marker))
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
            else await github.rest.issues.createComment({ owner, repo, issue_number, body })

  production:
    name: Production deploy
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ env.SITE_URL }}
    # Never run two production deploys at once; let an in-flight one finish.
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install -g ${{ env.VERCEL_CLI }}
      - run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Smoke test live site
        run: |
          fail=0
          expect() {
            code=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 5 "$SITE_URL$2")
            if [ "$code" = "$1" ]; then echo "ok   $code $2"; else echo "FAIL $code $2 (expected $1)"; fail=1; fi
          }
          expect 200 /
          expect 200 /blog/
          expect 200 /process-audit
          expect 200 /products
          expect 200 /technology
          expect 200 /sitemap.xml
          expect 404 /this-page-should-not-exist
          if [ $fail = 1 ]; then
            echo "::error::Smoke test failed. Roll back with: vercel rollback --token=\$VERCEL_TOKEN"
            exit 1
          fi
